name: Apply Box86 16K source patches

on:
  push:
    branches:
      - box86-16k
    paths:
      - patches/16k/**
      - .github/workflows/apply-box86-16k.yml

permissions:
  contents: write

jobs:
  apply-source-patches:
    if: ${{ !contains(github.event.head_commit.message, '[16k-source-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: box86-16k

      - name: Verify pristine patch targets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 0579f8b9c47d87d700724f4cce559b06cbd2b0f5^{commit})" = "0579f8b9c47d87d700724f4cce559b06cbd2b0f5"
          git apply --check patches/16k/0001-elfloader-non4k-host-pages.patch
          git apply --check patches/16k/0002-mprotect-4k-guest-on-large-host.patch
          git apply --check patches/16k/0003-rpi5-arm64-build-profile.patch

      - name: Apply 16K source patches
        shell: bash
        run: |
          set -euo pipefail
          git apply patches/16k/0001-elfloader-non4k-host-pages.patch
          git apply patches/16k/0002-mprotect-4k-guest-on-large-host.patch
          git apply patches/16k/0003-rpi5-arm64-build-profile.patch
          git diff --check

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt src/elfs/elfloader.c src/wrapped/wrappedlibc.c
          git commit -m "[16K] Apply Pi 5 large-page runtime fixes [16k-source-applied]"
          git push origin HEAD:box86-16k
